l_english:
  je_silvermoon_wretched: "The Wretched"
  je_silvermoon_wretched_reason: "Many of our people did not survive the fall of the Sunwell whole. Starved of arcane power, the #bold Wretched#! roam the ruins of old Silvermoon, gaunt, feverish and hostile to anyone who will not feed their hunger.\n\nEvery month they starve further into oblivion. The #bold Wretched Threat#! grows; from 50 onwards, they raid our roads, harbors and academies. We hold claims on their lands, but a war against them might be futile, as we would be fighting our own kind and define our own future by not addressing the cause of our need.\n\nBetter to win their trust with a #bold Mana Pact#!, which places them under our protection. Then we must choose:\n#bold Absorb#! them at once – quick, but their addicts will bring unrest, radicals and sickness into our lands for years.\n#bold Heal#! them – @money!100,000 at once and @money!10,000 every month, and our healers need #bold three stages of 20 months#!; each stage eases their hunger, a relapse sets it back. The work only advances while Mana is plentiful in the Wretched market and we are at peace. In the end they might join us whole, without strife."
  je_silvermoon_wretched_status_independent: "The Wretched still go their own way."
  je_silvermoon_wretched_status_protectorate: "The Wretched are under our protection. We must decide their fate."
  je_silvermoon_wretched_status_healing: "Our healers are working among the Wretched."
  je_silvermoon_wretched_status_starved: "#negative_value The healing stalls: Mana is scarce in the Wretched market.#!"
  je_silvermoon_wretched_status_war: "#negative_value The healing stalls while we are at war.#!"

  va_silvermoon_wretched_partner_tt: "The Wretched are under our protection"
  va_silvermoon_wretched_mana_supplied_tt: "Mana is not scarce in the Wretched market"
  va_silvermoon_wretched_free_tt: "The Wretched are not anyone's subject"
  va_silvermoon_wretched_peace_tt: "We are not at war with the Wretched"
  va_silvermoon_wretched_cooldown_tt: "We have not offered a pact in the last year"
  va_silvermoon_wretched_not_at_war_tt: "We are not at war"
  va_silvermoon_wretched_not_bankrupt_tt: "We have not declared bankruptcy"

  va_silvermoon_wretched_pact_button: "Offer a Mana Pact"
  va_silvermoon_wretched_pact_button_desc: "Offer the Wretched Mana and protection. If they accept, they become our protectorate."
  va_silvermoon_wretched_annex_button: "Absorb the Wretched"
  va_silvermoon_wretched_annex_button_desc: "Take the Wretched into our realm now, as they are. How long their addicts burden our lands with unrest, radicals and sickness depends on how deep their hunger runs."
  va_silvermoon_wretched_heal_button: "Begin the Healing"
  va_silvermoon_wretched_heal_button_desc: "Send healers and Mana to the Wretched. Costs @money!100,000 now, @money!10,000 every month and Bureaucracy while it lasts. When the work is done they join us without strife. While Grand Magister Rommath oversees the work, patients relapse only after five months without Mana instead of three."
  va_silvermoon_wretched_bar: "Healing the Wretched"
  va_silvermoon_wretched_bar_desc: "Months of healing. At 60 the Wretched are whole again and join us."
  va_silvermoon_wretched_bar_progress_desc: "Healers at work"
  va_silvermoon_wretched_bar_stalled_war_desc: "#negative_value Stalled: we are at war#!"
  va_silvermoon_wretched_bar_stalled_mana_desc: "#negative_value Stalled: Mana is scarce in the Wretched market#!"

  va_wretched_addicts: "Wretched Addicts"
  va_wretched_addicts_desc: "The Wretched were taken in without being healed. Their hunger breeds sickness, crime and anger."
  va_silvermoon_wretched_healing: "Healing the Wretched"
  va_silvermoon_wretched_healing_desc: "Healers, magisters and Mana shipments are bound up in curing the Wretched."
  va_silvermoon_wretched_absorbed: "The Wretched Absorbed"
  va_silvermoon_wretched_absorbed_desc: "Many resent that the court swallowed the Wretched instead of curing them."
  va_silvermoon_wretched_restored: "The Wretched Restored"
  va_silvermoon_wretched_restored_desc: "The Wretched have been healed and stand with us again."

  wretched_events.1.t: "A Pact Offered"
  wretched_events.1.d: "Elves from Silvermoon… here, in our ruins! They bring Mana… so much Mana! For it they want our obedience: their Rangers at our gates, their rules in our halls. Silvermoon left us. Left us to starve! And now they come back… smiling… with crystals."
  wretched_events.1.f: "\"Crystals… humming crystals! Mine… they could be mine! Haha… ha… how long since we felt that? How long…?\""
  wretched_events.1.a: "Yes…! Their Mana, their protection!"
  wretched_events.1.b: "Kneel? We were magisters! We kneel to no one!"
  wretched_events.2.t: "The Wretched Accept"
  wretched_events.2.d: "The Wretched have accepted our Mana Pact and now stand under our protection. We must now decide whether to absorb them or to heal them."
  wretched_events.2.f: "\"They are still our people, beneath the hunger.\""
  wretched_events.2.a: "Good."
  wretched_events.3.t: "The Wretched Refuse"
  wretched_events.3.d: "Our envoys returned empty-handed. The Wretched trust neither our Mana nor our promises."
  wretched_events.3.f: "\"Pride is the last thing a starving elf gives up.\""
  wretched_events.3.a: "Their hunger will change their minds."
  wretched_events.4.t: "The Wretched Absorbed"
  wretched_events.4.d: "By decree the lands of the Wretched are joined to ours. But their hunger did not end with the stroke of a pen. Addicted elves fill our streets and many ask why the court did not care for them first."
  wretched_events.4.f: "\"We annexed land and a problem.\""
  wretched_events.4.a: "They will learn to live with it."
  wretched_events.4.a.tt: "The former lands of the Wretched suffer from #bold Wretched Addicts#! for up to 10 years, depending on their hunger"
  wretched_events.5.t: "The Wretched Healed"
  wretched_events.5.d: "Years of care, Mana and patience have done what no decree could. The Wretched stand straight again, their eyes clear, and they return to Silvermoon as kin."
  wretched_events.5.f: "\"Welcome home.\""
  wretched_events.5.a: "Quel'Thalas is whole."

  va_silvermoon_wretched_threat_bar: "Wretched Threat"
  va_silvermoon_wretched_threat_bar_desc: "How dangerous the Wretched are to our roads, harbors and academies. From 50 they raid our lands, from 80 the raids become more desperate."
  va_silvermoon_wretched_threat_bar_hunger_desc: "#negative_value The Wretched are free and starving for Mana#!"
  va_silvermoon_wretched_threat_bar_healing_desc: "#positive_value Our healers calm the Wretched#!"
  va_wretched_threat_down_30_tt: "#bold Wretched Threat#! #positive_value -30#!"
  va_wretched_threat_down_10_tt: "#bold Wretched Threat#! #positive_value -10#!"
  va_wretched_threat_down_5_tt: "#bold Wretched Threat#! #positive_value -5#!"
  va_wretched_threat_up_5_tt: "#bold Wretched Threat#! #negative_value +5#!"
  va_wretched_threat_up_10_tt: "#bold Wretched Threat#! #negative_value +10#!"

  va_silvermoon_unsafe_road: "Unsafe Road"
  va_silvermoon_unsafe_road_desc: "Merchants avoid the road to Sunstrider Isle since the Wretched slew a caravan on it."
  va_silvermoon_harbor_overrun: "Harbor Overrun"
  va_silvermoon_harbor_overrun_desc: "The Wretched hold the docks of Sunsail Anchorage, and Grimscale murlocs pick over whatever cargo they leave behind."
  va_silvermoon_wall_breach: "Breach in the Wall"
  va_silvermoon_wall_breach_desc: "Stolen mana crystals tore a hole into the city wall. Rubble blocks the streets while panic spreads among the population."
  va_silvermoon_apprentices_disciplined: "Apprentices Disciplined"
  va_silvermoon_apprentices_disciplined_desc: "The magisters approve of the court’s firm hand: apprentices who stray from the road and walk into Wretched ambushes are punished for their carelessness."
  va_silvermoon_kinslaying_war: "War against Our Own"
  va_silvermoon_kinslaying_war_desc: "We march against the Wretched, and every Wretched who falls was once a citizen of Quel'Thalas. Many question the court that gave the order."
  va_silvermoon_kinslaying_scars: "Scars of the Kinslaying"
  va_silvermoon_kinslaying_scars_desc: "The Wretched were subdued by the sword, not healed. Their families have not forgotten."

  wretched_events.10.t: "Slain by the Wretched"
  wretched_events.10.d: "A caravan bound for Silvermoon was found on the road through Eversong, its guards and merchants slain. The crates of arcane goods were broken open and drained. Every sign points to the Wretched."
  wretched_events.10.f: "\"They did not even take the gold. Only the crystals.\""
  wretched_events.10.a: "Send patrols along the road."
  wretched_events.10.b: "Ship the goods by sea instead."
  wretched_events.11.t: "Unstable Mana Crystals"
  wretched_events.11.d: "Several crates of unstable mana crystals have vanished from a guard post. Lieutenant Aeldon Sunbrand fears the Wretched took them, and that they do not know how dangerous the crystals are."
  wretched_events.11.f: "\"If one of those cracks inside the city, we will hear it in Tranquillien.\""
  wretched_events.11.a: "Send out search parties."
  wretched_events.11.b: "Keep it quiet. The Guard must not look weak."
  wretched_events.11.b.tt: "The crystals stay missing. #negative_value They may turn up again in six months.#!"
  wretched_events.12.t: "Roadside Ambush"
  wretched_events.12.d: "Apprentices from the Falthrien Academy strayed from the road and were set upon by Wretched. Instructor Antheol demands they be punished for their carelessness; their families demand guards instead."
  wretched_events.12.f: "\"A magister who cannot keep to the road will not keep to the rules of magic.\""
  wretched_events.12.a: "Punish the apprentices."
  wretched_events.12.b: "Post guards at the academy."
  wretched_events.13.t: "Situation at Sunsail Anchorage"
  wretched_events.13.d: "The Wretched have stormed our docks at Sunsail Anchorage. While our sailors fled, Grimscale murlocs crept out of the surf and carried off the cargo. Captain Kelisendra offers to retake the quay, for a price."
  wretched_events.13.f: "\"First the Wretched, then the fish. Is nothing in this harbor ours anymore?\""
  wretched_events.13.a: "Abandon the docks for now."
  wretched_events.13.b: "Hire Captain Kelisendra."
  wretched_events.14.t: "Explosion at the City Wall"
  wretched_events.14.d: "A thunderclap of raw mana shook Silvermoon. Stolen crystals, carried too close by a careless Wretched, burst against the city wall and tore a breach into it."
  wretched_events.14.f: "\"Find out who let those crystals out of our sight.\""
  wretched_events.14.a: "Close the breach at once."
  wretched_events.14.b: "Let the people see what the Wretched have done."
  wretched_events.15.t: "Apprentices Fall to the Hunger"
  wretched_events.15.d: "Mana runs short even in Silvermoon. At Duskwither Spire, apprentices who once studied the arcane now steal it, and some have already fled to the ruins to join the Wretched."
  wretched_events.15.f: "\"The hunger does not ask whether you wear a magister's robe.\""
  wretched_events.15.a: "Supply the academies with Mana."
  wretched_events.15.b: "Banish the addicts."
  wretched_events.16.t: "War against Our Own"
  wretched_events.16.d: "The Wretched are broken and their lands are ours again. But they were not healed, only defeated. Their hunger now lives inside our borders, and their kin will remember who wielded the sword."
  wretched_events.16.f: "\"We won. Why does it feel like mourning?\""
  wretched_events.16.a: "It had to be done."
  # Raserei bei Bedrohung 100 (Kono 2026-11-12)
  wretched_events.17.t: "The Wretched March"
  wretched_events.17.d: "The hunger has become unbearable. Driven mad by withdrawal, the Wretched pour out of the ruins and the shipyards, crazed and fearless, to seize what is left of our share of the land. Their frenzy will not last, but for now they fight like the damned."
  wretched_events.17.f: "\"More! MORE! It burns… hehehe… it burns!\" – the cry from the ruins before the charge. They did not even seem to feel our blades."
  wretched_events.17.a: "Hold the line."
  va_wretched_frenzy_tt: "The Wretched declare war to take our part of a region they share with us. They fight in a #negative_value Frenzy#!: +30% army offense and defense, falling to +20% after 6 months, +10% after a year, gone after 2 years. Endure it, or break them and take their land."
  va_wretched_frenzy_play: "Frenzy of the Wretched"
  va_wretched_frenzy_1: "Wretched Frenzy"
  va_wretched_frenzy_1_desc: "It burns… it BURNS! More! Take it, take it all! Blades? We feel no blades… hehehe…"
  va_wretched_frenzy_2: "Wretched Frenzy"
  va_wretched_frenzy_2_desc: "The fire… it dims. Still hungry… still… so hungry…"
  va_wretched_frenzy_3: "Wretched Frenzy"
  va_wretched_frenzy_3_desc: "Embers… only embers left. Cold. So cold…"
