l_english:
  je_silvermoon_wretched: "The Wretched (AI WRITTEN)"
  je_silvermoon_wretched_reason: "Many of our people did not survive the fall of the Sunwell whole. Starved of arcane power, the #bold Wretched#! roam the ruins of old Silvermoon, gaunt, feverish and hostile to anyone who will not feed their hunger.\n\nEvery month they starve unchecked, the #bold Wretched Threat#! grows; from 50 they raid our roads, harbors and academies. We hold claims on their lands, but a war against them is a war against our own people.\n\nBetter to win their trust with a #bold Mana Pact#!, which places them under our protection. Then we must choose:\n#bold Absorb#! them at once – quick, but their addicts will bring unrest, radicals and sickness into our lands for years.\n#bold Heal#! them – @money!100,000 at once and @money!10,000 every month, and our healers need #bold three stages of 20 months#!; each stage eases their hunger, a relapse sets it back. The work only advances while Mana is plentiful in the Wretched market and we are at peace. In the end they join us whole, without strife. (AI WRITTEN)"
  je_silvermoon_wretched_status_independent: "The Wretched still go their own way. (AI WRITTEN)"
  je_silvermoon_wretched_status_protectorate: "The Wretched are under our protection. We must decide their fate. (AI WRITTEN)"
  je_silvermoon_wretched_status_healing: "Our healers are working among the Wretched. (AI WRITTEN)"
  je_silvermoon_wretched_status_starved: "#negative_value The healing stalls: Mana is scarce in the Wretched market.#! (AI WRITTEN)"
  je_silvermoon_wretched_status_war: "#negative_value The healing stalls while we are at war.#! (AI WRITTEN)"

  va_silvermoon_wretched_partner_tt: "The Wretched are under our protection (AI WRITTEN)"
  va_silvermoon_wretched_mana_supplied_tt: "Mana is not scarce in the Wretched market (AI WRITTEN)"
  va_silvermoon_wretched_free_tt: "The Wretched are not anyone's subject (AI WRITTEN)"
  va_silvermoon_wretched_peace_tt: "We are not at war with the Wretched (AI WRITTEN)"
  va_silvermoon_wretched_cooldown_tt: "We have not offered a pact in the last year (AI WRITTEN)"
  va_silvermoon_wretched_not_at_war_tt: "We are not at war (AI WRITTEN)"
  va_silvermoon_wretched_not_bankrupt_tt: "We have not declared bankruptcy (AI WRITTEN)"

  va_silvermoon_wretched_pact_button: "Offer a Mana Pact (AI WRITTEN)"
  va_silvermoon_wretched_pact_button_desc: "Offer the Wretched Mana and protection. If they accept, they become our protectorate. We can only ask once a year. (AI WRITTEN)"
  va_silvermoon_wretched_annex_button: "Absorb the Wretched (AI WRITTEN)"
  va_silvermoon_wretched_annex_button_desc: "Take the Wretched into our realm now, as they are. How long their addicts burden our lands with unrest, radicals and sickness depends on how deep their hunger runs: up to ten years. (AI WRITTEN)"
  va_silvermoon_wretched_heal_button: "Begin the Healing (AI WRITTEN)"
  va_silvermoon_wretched_heal_button_desc: "Send healers and Mana to the Wretched. Costs @money!100,000 now, @money!10,000 every month and Bureaucracy while it lasts. When the work is done they join us without strife. (AI WRITTEN)"

  va_silvermoon_wretched_bar: "Healing the Wretched (AI WRITTEN)"
  va_silvermoon_wretched_bar_desc: "Months of healing. At 60 the Wretched are whole again and join us. (AI WRITTEN)"
  va_silvermoon_wretched_bar_progress_desc: "Healers at work (AI WRITTEN)"
  va_silvermoon_wretched_bar_stalled_war_desc: "#negative_value Stalled: we are at war#! (AI WRITTEN)"
  va_silvermoon_wretched_bar_stalled_mana_desc: "#negative_value Stalled: Mana is scarce in the Wretched market#! (AI WRITTEN)"

  va_wretched_addicts: "Wretched Addicts (AI WRITTEN)"
  va_wretched_addicts_desc: "The Wretched were taken in without being healed. Their hunger breeds sickness, crime and anger. (AI WRITTEN)"
  va_silvermoon_wretched_healing: "Healing the Wretched (AI WRITTEN)"
  va_silvermoon_wretched_healing_desc: "Healers, magisters and Mana shipments are bound up in curing the Wretched. (AI WRITTEN)"
  va_silvermoon_wretched_absorbed: "The Wretched Absorbed (AI WRITTEN)"
  va_silvermoon_wretched_absorbed_desc: "Many resent that the court swallowed the Wretched instead of curing them. (AI WRITTEN)"
  va_silvermoon_wretched_restored: "The Wretched Restored (AI WRITTEN)"
  va_silvermoon_wretched_restored_desc: "The Wretched have been healed and stand with us again. Quel'Thalas admires such mercy. (AI WRITTEN)"

  wretched_events.1.t: "A Pact Offered (AI WRITTEN)"
  wretched_events.1.d: "Envoys from Silvermoon have come to the ruins. They offer Mana and the protection of their Rangers, if we accept their rule over our affairs. Our people starve for magic, yet many still remember that Silvermoon left them behind. (AI WRITTEN)"
  wretched_events.1.f: "\"They bring crystals that hum with power. How long since we felt that?\" (AI WRITTEN)"
  wretched_events.1.a: "Accept their protection. (AI WRITTEN)"
  wretched_events.1.b: "We will not kneel. (AI WRITTEN)"
  wretched_events.2.t: "The Wretched Accept (AI WRITTEN)"
  wretched_events.2.d: "The Wretched have accepted our Mana Pact and now stand under our protection. We must now decide whether to absorb them or to heal them. (AI WRITTEN)"
  wretched_events.2.f: "\"They are still our people, beneath the hunger.\" (AI WRITTEN)"
  wretched_events.2.a: "Good. (AI WRITTEN)"
  wretched_events.3.t: "The Wretched Refuse (AI WRITTEN)"
  wretched_events.3.d: "Our envoys returned empty-handed. The Wretched trust neither our Mana nor our promises. We may try again in a year. (AI WRITTEN)"
  wretched_events.3.f: "\"Pride is the last thing a starving elf gives up.\" (AI WRITTEN)"
  wretched_events.3.a: "Their hunger will change their minds. (AI WRITTEN)"
  wretched_events.4.t: "The Wretched Absorbed (AI WRITTEN)"
  wretched_events.4.d: "By decree the lands of the Wretched are joined to ours. Their hunger did not end with the stroke of a pen: addicts fill our streets, and many ask why the court did not heal them first. (AI WRITTEN)"
  wretched_events.4.f: "\"We have gained land, and a wound.\" (AI WRITTEN)"
  wretched_events.4.a: "They will learn to live with it. (AI WRITTEN)"
  wretched_events.4.a.tt: "The former lands of the Wretched suffer from #bold Wretched Addicts#! for up to 10 years, depending on their hunger (AI WRITTEN)"
  wretched_events.5.t: "The Wretched Healed (AI WRITTEN)"
  wretched_events.5.d: "Years of care, Mana and patience have done what no decree could. The Wretched stand straight again, their eyes clear, and they return to Silvermoon as kin. (AI WRITTEN)"
  wretched_events.5.f: "\"Welcome home.\" (AI WRITTEN)"
  wretched_events.5.a: "Quel'Thalas is whole. (AI WRITTEN)"

  va_silvermoon_wretched_threat_bar: "Wretched Threat (AI WRITTEN)"
  va_silvermoon_wretched_threat_bar_desc: "How dangerous the Wretched are to our roads, harbors and academies. From 50 they raid our lands, from 80 the raids turn grave. A pact, patrols and healing lower it. (AI WRITTEN)"
  va_silvermoon_wretched_threat_bar_hunger_desc: "#negative_value The Wretched are free and starving for Mana#! (AI WRITTEN)"
  va_silvermoon_wretched_threat_bar_healing_desc: "#positive_value Our healers calm the Wretched#! (AI WRITTEN)"
  va_wretched_threat_down_30_tt: "#bold Wretched Threat#! #positive_value -30#! (AI WRITTEN)"
  va_wretched_threat_down_10_tt: "#bold Wretched Threat#! #positive_value -10#! (AI WRITTEN)"
  va_wretched_threat_down_5_tt: "#bold Wretched Threat#! #positive_value -5#! (AI WRITTEN)"
  va_wretched_threat_up_5_tt: "#bold Wretched Threat#! #negative_value +5#! (AI WRITTEN)"
  va_wretched_threat_up_10_tt: "#bold Wretched Threat#! #negative_value +10#! (AI WRITTEN)"

  va_silvermoon_unsafe_road: "Unsafe Road (AI WRITTEN)"
  va_silvermoon_unsafe_road_desc: "Merchants avoid the road to Sunstrider Isle since the Wretched slew a caravan on it. Goods go the long way by sea. (AI WRITTEN)"
  va_silvermoon_harbor_overrun: "Harbor Overrun (AI WRITTEN)"
  va_silvermoon_harbor_overrun_desc: "The Wretched hold the docks of Sunsail Anchorage, and Grimscale murlocs pick over whatever cargo they leave behind. (AI WRITTEN)"
  va_silvermoon_wall_breach: "Breach in the Wall (AI WRITTEN)"
  va_silvermoon_wall_breach_desc: "Stolen mana crystals tore a hole into the city wall. Rubble blocks the streets and fear fills the taverns. (AI WRITTEN)"
  va_silvermoon_apprentices_disciplined: "Apprentices Disciplined (AI WRITTEN)"
  va_silvermoon_apprentices_disciplined_desc: "The magisters approve that careless apprentices answer for wandering into Wretched ambushes. (AI WRITTEN)"
  va_silvermoon_kinslaying_war: "War against Our Own (AI WRITTEN)"
  va_silvermoon_kinslaying_war_desc: "We march against the Wretched, and every Wretched who falls was once a citizen of Quel'Thalas. Many question the court that gave the order. (AI WRITTEN)"
  va_silvermoon_kinslaying_scars: "Scars of the Kinslaying (AI WRITTEN)"
  va_silvermoon_kinslaying_scars_desc: "The Wretched were subdued by the sword, not healed. Their families have not forgotten. (AI WRITTEN)"

  wretched_events.10.t: "Slain by the Wretched (AI WRITTEN)"
  wretched_events.10.d: "A caravan bound for Silvermoon was found on the road through Eversong, its guards and merchants slain. The crates of arcane goods were broken open and drained. Every sign points to the Wretched. (AI WRITTEN)"
  wretched_events.10.f: "\"They did not even take the gold. Only the crystals.\" (AI WRITTEN)"
  wretched_events.10.a: "Send patrols along the road. (AI WRITTEN)"
  wretched_events.10.b: "Ship the goods by sea instead. (AI WRITTEN)"
  wretched_events.11.t: "Unstable Mana Crystals (AI WRITTEN)"
  wretched_events.11.d: "Several crates of unstable mana crystals have vanished from a guard post. Lieutenant Aeldon Sunbrand fears the Wretched took them, and that they do not know how dangerous the crystals are. (AI WRITTEN)"
  wretched_events.11.f: "\"If one of those cracks inside the city, we will hear it in Tranquillien.\" (AI WRITTEN)"
  wretched_events.11.a: "Send out search parties. (AI WRITTEN)"
  wretched_events.11.b: "Keep it quiet. The Guard must not look weak. (AI WRITTEN)"
  wretched_events.11.b.tt: "The crystals stay missing. #negative_value They may turn up again in six months.#! (AI WRITTEN)"
  wretched_events.12.t: "Roadside Ambush (AI WRITTEN)"
  wretched_events.12.d: "Apprentices from the Falthrien Academy strayed from the road and were set upon by Wretched. Instructor Antheol demands they be punished for their carelessness; their families demand guards instead. (AI WRITTEN)"
  wretched_events.12.f: "\"A magister who cannot keep to the road will not keep to the rules of magic.\" (AI WRITTEN)"
  wretched_events.12.a: "Punish the apprentices. (AI WRITTEN)"
  wretched_events.12.b: "Post guards at the academy. (AI WRITTEN)"
  wretched_events.13.t: "Situation at Sunsail Anchorage (AI WRITTEN)"
  wretched_events.13.d: "The Wretched have stormed our docks at Sunsail Anchorage. While our sailors fled, Grimscale murlocs crept out of the surf and carried off the cargo. Captain Kelisendra offers to retake the quay, for a price. (AI WRITTEN)"
  wretched_events.13.f: "\"First the Wretched, then the fish. Is nothing in this harbor ours anymore?\" (AI WRITTEN)"
  wretched_events.13.a: "Abandon the docks for now. (AI WRITTEN)"
  wretched_events.13.b: "Hire Captain Kelisendra. (AI WRITTEN)"
  wretched_events.14.t: "Explosion at the City Wall (AI WRITTEN)"
  wretched_events.14.d: "A thunderclap of raw mana shook Silvermoon. Stolen crystals, carried too close by a careless Wretched, burst against the city wall and tore a breach into it. (AI WRITTEN)"
  wretched_events.14.f: "\"Find out who let those crystals out of our sight.\" (AI WRITTEN)"
  wretched_events.14.a: "Close the breach at once. (AI WRITTEN)"
  wretched_events.14.b: "Let the people see what the Wretched have done. (AI WRITTEN)"
  wretched_events.15.t: "Apprentices Fall to the Hunger (AI WRITTEN)"
  wretched_events.15.d: "Mana runs short even in Silvermoon. At Duskwither Spire, apprentices who once studied the arcane now steal it, and some have already fled to the ruins to join the Wretched. (AI WRITTEN)"
  wretched_events.15.f: "\"The hunger does not ask whether you wear a magister's robe.\" (AI WRITTEN)"
  wretched_events.15.a: "Supply the academies with Mana. (AI WRITTEN)"
  wretched_events.15.b: "Banish the addicts. (AI WRITTEN)"
  wretched_events.16.t: "War against Our Own (AI WRITTEN)"
  wretched_events.16.d: "The Wretched are broken and their lands are ours again. But they were not healed, only defeated. Their hunger now lives inside our borders, and their kin will remember who wielded the sword. (AI WRITTEN)"
  wretched_events.16.f: "\"We won. Why does it feel like mourning?\" (AI WRITTEN)"
  wretched_events.16.a: "It had to be done. (AI WRITTEN)"
