  je_va_dead_scar: "Curing the Path of Destruction"
  je_va_dead_scar_reason: "The Armies of the Scourge marched during the Third War all the way to the Isle of Quel'Danas, leaving a path of blighted earth and corruption behind. Unless cleansing these areas is pursued, only the Undead can inhabit these regions.\n\nInitiating the Ritual costs @money!100,000. Clerics and mages must sustain the Ritual for 20 months, consuming both Mana and Paper from our market. A lack of either material will stall the Ritual and halt all progress. Once the Ritual is completed, the region will be suitable for life once more."
  je_va_dead_scar_complete_tt: "No land in Azeroth lies on the Dead Scar anymore"
  je_va_dead_scar_status_idle: "No active Ritual Site is constructed in this region."
  je_va_dead_scar_status_running: "A Purification Ritual is currently underway."
  je_va_dead_scar_status_stalled: "At least one Ritual Site lacks Mana or Paper. Progress is stalled and will resume once all goods are supplied."
  va_dead_scar_bar_progress_desc: "Active Ritual Site"
  va_dead_scar_bar_stalled_desc: "#negative_value Stalled: the Ritual Site lacks Mana or Paper#!"
  je_va_dead_scar_invalid_tt: "We no longer hold any land on the Dead Scar"
  va_dead_scar_stop_tt: "The Ritual Site in this region is torn down."
  va_dead_scar_start_button_desc: "Establish a Ritual Site in this region. Initiating the ritual costs @money! 100,000. Each month, progress is made based on the availability of required goods."
  va_dead_scar_stop_button_desc: "Tear down the Ritual Site. Removes the monthly costs, but the Ritual Site must be re-established to make further progress."
  va_dead_scar_ward_not_bankrupt_tt: "We are not bankrupt"
  va_country_undead_primary_trigger_tt: "A primary culture is undead (AI WRITTEN)"

  building_va_scar_ward: "Ritual Site"
  building_va_scar_ward_desc: "Clerks and mages channel mana into the blighted soil, purging the taint of the Scourge."
  bg_va_dead_scar_healing: "Dead Scar Healing"
  pmg_base_building_va_scar_ward: "Ritual"
  pm_ritual_circles_building_va_scar_ward: "Ritual Circles"

  va_dead_scar_land_restored: "The Land Restored"
  va_dead_scar_land_restored_desc: "The Land has been cleansed from the Dead Scar."

  dead_scar_events.1.t: "The Scar Recedes"
  dead_scar_events.1.d: "After twenty months, our ritualists report success: the blight has lifted from [SCOPE.sState('va_healed_state').GetName]. Grass breaks through the soil and life is possible again."
  dead_scar_events.1.d_undead: "Our ritualists have purged the Scourge's taint from [SCOPE.sState('va_healed_state').GetName]. Living things creep back into the soil. Some of our people call it a victory over the Lich King; others wonder what place the dead have in a land that heals."
  dead_scar_events.1.f: "\"The land remembers what it was. We only had to remind it.\""
  dead_scar_events.1.a: "One wound closed."
  dead_scar_events.2.t: "The Dead Scar is cleansed."
  dead_scar_events.2.d: "The last trace of the Dead Scar has faded. From the Sunwell to Deathholme, the land is whole again."
  dead_scar_events.2.f: "\"Eversong is green once more.\""
  dead_scar_events.2.a: "Never again shall the blight return."
