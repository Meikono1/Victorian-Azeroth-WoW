l_english:
  # Wretched Schritt 2–4 (VA-021): Sucht-Stufen, Heil-Etappen, Kopfgeld, Zerfall, Mana-Aufstand, Nachspiel.

  va_wretched_addiction_3: "Desperate Hunger"
  va_wretched_addiction_3_desc: "Mana… we need Mana! It burns, everything burns! The weak waste away, the strong… the strong take. Work? Hehehe… work does not feed the hunger!"
  va_wretched_addiction_2: "Gnawing Hunger"
  va_wretched_addiction_2_desc: "The hunger gnaws… always gnawing. But we… we can think again. Mostly. Mostly…"
  va_wretched_addiction_1: "Restrained Hunger"
  va_wretched_addiction_1_desc: "We hold the hunger… on a leash. Only the weakest still slip. Only… the weakest."
  va_wretched_supervised_withdrawal: "Supervised Withdrawal"
  va_wretched_supervised_withdrawal_desc: "Silvermoon's healers watch… always watching. No crystals. No crystals! It burns out of us, slowly… Fewer of us die. Few of us can work."
  va_wretched_clarity: "Clarity"
  va_wretched_clarity_desc: "Clear… everything is so clear. Were the trees always… this red?"
  va_wretched_homesick: "Longing for Home"
  va_wretched_homesick_desc: "Silvermoon… the spires, our families. We want to go home. Will they… will they still know us?"
  va_mana_crackdown: "Crackdown on the Hungry"
  va_mana_crackdown_desc: "Guards drive the Mana-starved from our streets. The affliction is hidden from sight, not cured."

  va_silvermoon_wretched_hope: "Growing Hope"
  va_silvermoon_wretched_hope_desc: "The first of the Wretched have been restored. The court's patience bears fruit, and hope returns to Silvermoon."
  va_silvermoon_wretched_families: "Families Reunited"
  va_silvermoon_wretched_families_desc: "The families of Silvermoon find their lost kin among the healed Wretched, and old wounds begin to close."
  va_silvermoon_wretched_ranger_volunteers: "Healed Rangers"
  va_silvermoon_wretched_ranger_volunteers_desc: "Former Wretched now serve among the Farstriders, eager to prove themselves worthy of the name they once lost."
  va_silvermoon_wretched_worker_volunteers: "Healed Workers"
  va_silvermoon_wretched_worker_volunteers_desc: "Former Wretched labor in our workshops with the fervor of those newly freed from the hunger."
  va_silvermoon_wretched_absorbed_mild: "The Wretched Absorbed"
  va_silvermoon_wretched_absorbed_mild_desc: "The Wretched were taken in but half-healed. Some still hold it against the court."
  va_silvermoon_wretched_absorbed_light: "The Wretched Absorbed"
  va_silvermoon_wretched_absorbed_light_desc: "The Wretched were nearly whole when we took them in, yet some still ask why the cure was never finished."
  va_silvermoon_wretched_neglected: "Our Own Left Behind"
  va_silvermoon_wretched_neglected_desc: "Twenty years have passed, and the Wretched still haunt the ruins. Quel'Thalas, it is said, cannot even care for its own."
  va_silvermoon_mana_store_crackdown: "Mana Stores Guarded"
  va_silvermoon_mana_store_crackdown_desc: "Soldiers stand guard over the Mana stores against starving addicts, and the addicts' kin seethe in silence."

  va_wretched_addiction_down_tt: "The #bold Wretched hunger#! eases by one stage"
  va_wretched_threat_down_20_tt: "#bold Wretched Threat#! #positive_value -20#!"
  va_wretched_threat_up_30_tt: "#bold Wretched Threat#! #negative_value +30#!"
  va_silvermoon_wretched_no_hunt_tt: "No other hunt is underway"
  va_silvermoon_wretched_hunt_cooldown_tt: "No hunt for this leader has failed in the last year"

  va_silvermoon_wretched_bounty_thaelis_button: "WANTED: Thaelis the Hungerer"
  va_silvermoon_wretched_bounty_thaelis_button_desc: "Post a bounty of @money!30,000 on the leader of the Wretched in the ruins. Each month our hunters have a 15% chance to bring back his head; after 12 months the hunt fails and the threat grows. While Halduron Brightwing serves us, the hunters' chance rises by 10 percent."
  va_silvermoon_wretched_bounty_aldaron_button: "Strike at Aldaron the Reckless"
  va_silvermoon_wretched_bounty_aldaron_button_desc: "Send Rangers for @money!25,000 to kill the ringleader of Sunsail Anchorage while he lies in a Mana stupor. 20% chance each month, at most 12 months. His death frees our harbor. While Halduron Brightwing serves us, the hunters' chance rises by 10 percent."
  va_silvermoon_wretched_bounty_felendren_button: "Hunt Felendren the Banished"
  va_silvermoon_wretched_bounty_felendren_button_desc: "Storm the Falthrien Academy for @money!20,000 and end the banished magister who stirs up the Wretched. 25% chance each month, at most 12 months. While Halduron Brightwing serves us, the hunters' chance rises by 10 percent."
  va_name_thaelis: "Thaelis"
  va_name_the_hungerer: "the Hungerer"
  va_name_aldaron: "Aldaron"
  va_name_the_reckless: "the Reckless"
  va_name_felendren: "Felendren"
  va_name_the_banished: "the Banished"

  wretched_heal_events.1.t: "The First to Recover"
  wretched_heal_events.1.d: "After months of fever and screaming, the first of the Wretched have awoken without the hunger gnawing at them. They ask for bread rather than crystals, and our healers weep alongside them."
  wretched_heal_events.1.f: "\"She knew my name. For the first time in years, she knew my name.\""
  wretched_heal_events.1.a: "The work continues."
  wretched_heal_events.2.t: "Their Eyes Grow Clear"
  wretched_heal_events.2.d: "Most of the Wretched now master their hunger, and many ask how they might repay Silvermoon. The Farstriders would gladly take them, as would our workshops."
  wretched_heal_events.2.f: "\"Give us work… please. We will show you… who we were.\""
  wretched_heal_events.2.a: "Let them serve with the Rangers."
  wretched_heal_events.2.b: "Let them work in our workshops."
  wretched_heal_events.3.t: "Relapse"
  wretched_heal_events.3.d: "For months, Mana has run dry in the Wretched market. Our patients claw at the doors of the infirmaries, and some have already fled back to the ruins."
  wretched_heal_events.3.f: "\"Just one… just one crystal! You promised! It burns… why does no one see it burns?\""
  wretched_heal_events.3.a: "Send an emergency shipment of Mana."
  wretched_heal_events.3.b: "We cannot afford it."
  wretched_heal_events.3.b.tt: "The healing loses #negative_value 6 months#! of progress"
  wretched_heal_events.4.t: "Plunder of the Mana Stores"
  wretched_heal_events.4.d: "Addicts from the former lands of the Wretched have broken into a Mana store. The guards await our orders; the healers plead for funds."
  wretched_heal_events.4.f: "\"Ours! The Mana is OURS! You took us in… now feed us! Hehehe…\""
  wretched_heal_events.4.a: "Guard the stores with steel."
  wretched_heal_events.4.b: "Pay for their care."

  wretched_bounty_events.1.t: "WANTED: Thaelis the Hungerer"
  wretched_bounty_events.1.d: "Our hunters have returned from the ruins bearing the head of Thaelis the Hungerer. Sergeant Kan'ren paid the bounty without a word. The Wretched of the ruins are left without a leader."
  wretched_bounty_events.1.f: "\"He was a magister once. Remember that, when you tell the story.\""
  wretched_bounty_events.1.a: "Justice is done."
  wretched_bounty_events.2.t: "The Hunt Has Failed"
  wretched_bounty_events.2.d: "A year has passed, and our hunters have found naught but traps and the bodies of their comrades. From the ruins, the Wretched mock our bounty."
  wretched_bounty_events.2.f: "\"Hunters… little hunters in our ruins! Hehehe… come back! Come back and play!\" – scratched into a wall where our hunters fell"
  wretched_bounty_events.2.a: "We shall try again."
  wretched_bounty_events.2.a.tt: "We cannot hunt this leader again for a year"
  wretched_bounty_events.3.t: "The Ringleader Falls"
  wretched_bounty_events.3.d: "Our Rangers struck while Aldaron the Reckless and his band lay senseless in a Mana stupor. Aldaron is dead, the stolen Ranger weapons are recovered, and the docks of Sunsail Anchorage are ours once more."
  wretched_bounty_events.3.f: "\"Reckless to the end.\""
  wretched_bounty_events.3.a: "Reopen the harbor."
  wretched_bounty_events.4.t: "Felendren the Banished"
  wretched_bounty_events.4.d: "Felendren the Banished lies dead among the arcane wraiths of the Falthrien Academy. In his hand our soldiers found a tainted arcane sliver that still hums with a power none of our magisters can name."
  wretched_bounty_events.4.f: "\"Whoever gave him this meant him no good. Nor us.\""
  wretched_bounty_events.4.a: "Arcanist Helion shall study it."
  wretched_bounty_events.4.b: "Destroy the sliver."
  wretched_bounty_events.5.t: "The Wretched Take Revenge"
  wretched_bounty_events.5.d: "Enraged by the death of one of their leaders, the Wretched have fallen upon our roads and outposts. They left the bodies where we were certain to find them."
  wretched_bounty_events.5.f: "\"You took one of us… we take more! Always more!\" – written in blood on the outpost wall"
  wretched_bounty_events.5.a: "Bury the dead."
  wretched_bounty_events.6.t: "The Wretched Fall Apart"
  wretched_bounty_events.6.d: "With Thaelis, Aldaron and Felendren dead, the Wretched have no one left to follow. Their bands turned upon one another and upon the land itself. Silvermoon reclaims what remains: scorched fields, gutted halls and addicts without a master."
  wretched_bounty_events.6.f: "\"We have our land back. It is not the land we lost.\""
  wretched_bounty_events.6.a: "Let the rebuilding begin."
  wretched_bounty_events.6.a.tt: "The lands of the Wretched join Silvermoon, #negative_value devastated#! and burdened with #bold Wretched Addicts#! according to their hunger"

  mana_uprising_events.1.t: "Hungry in the Streets"
  mana_uprising_events.1.d: "For a year our people have gone without enough Mana. In the poorer quarters, the hungry gather in silence before the Mana stores, and some already whisper of the Wretched."
  mana_uprising_events.1.f: "\"Just a little… only a little Mana… it burns, can't you see it burns?\""
  mana_uprising_events.1.a: "Open the emergency stores."
  mana_uprising_events.1.a.tt: "The unrest over Mana shortage eases by #positive_value 6 months#!"
  mana_uprising_events.1.b: "Reinforce the guards."
  mana_uprising_events.1.b.tt: "The Mana shortage remains. #negative_value If it lasts another year, the hungry will rise.#!"
  mana_uprising_events.2.t: "Rise of the Wretched"
  mana_uprising_events.2.d: "Two years without enough Mana have achieved what no enemy could. Starving elves have risen in one of our provinces, cast out our officials and declared themselves free of a crown that let them hunger. The Wretched have returned."
  mana_uprising_events.2.f: "\"We were warned.\""
  mana_uprising_events.2.a: "Bring them back by force."
  mana_uprising_events.2.a.tt: "A province breaks away as the #bold Wretched#! and we go to war to take it back"
  mana_uprising_events.3.t: "Flight to the Ruins"
  mana_uprising_events.3.d: "Two years without enough Mana have driven thousands of our people to despair. They have fled to the Wretched, and those who remain curse the crown."
  mana_uprising_events.3.f: "\"The ruins… the ruins have Mana! More than the crown gives… more… MORE!\""
  mana_uprising_events.3.a: "Let them go."
