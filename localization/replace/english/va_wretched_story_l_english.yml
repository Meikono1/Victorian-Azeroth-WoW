l_english:
  # Wretched Schritt 2–4 (VA-021): Sucht-Stufen, Heil-Etappen, Kopfgeld, Zerfall, Mana-Aufstand, Nachspiel.

  va_wretched_addiction_3: "Desperate Hunger (AI WRITTEN)"
  va_wretched_addiction_3_desc: "Our people crave Mana beyond all reason. They waste away, work poorly and die young. (AI WRITTEN)"
  va_wretched_addiction_2: "Gnawing Hunger (AI WRITTEN)"
  va_wretched_addiction_2_desc: "The hunger for Mana still rules our people, but it no longer drives them to madness. (AI WRITTEN)"
  va_wretched_addiction_1: "Restrained Hunger (AI WRITTEN)"
  va_wretched_addiction_1_desc: "Our people have learned to master their hunger. Only the weakest still fall to it. (AI WRITTEN)"
  va_wretched_supervised_withdrawal: "Supervised Withdrawal (AI WRITTEN)"
  va_wretched_supervised_withdrawal_desc: "Healers from Silvermoon watch over the Wretched as the hunger burns out of them. Fewer die, but few can work. (AI WRITTEN)"
  va_wretched_clarity: "Clarity (AI WRITTEN)"
  va_wretched_clarity_desc: "For the first time in years, the Wretched see the world with clear eyes. (AI WRITTEN)"
  va_wretched_homesick: "Longing for Home (AI WRITTEN)"
  va_wretched_homesick_desc: "The healed Wretched long to return to their families in Silvermoon. (AI WRITTEN)"
  va_mana_crackdown: "Crackdown on the Hungry (AI WRITTEN)"
  va_mana_crackdown_desc: "Guards drive the Mana-starved from the streets. The problem is hidden, not solved. (AI WRITTEN)"

  va_silvermoon_wretched_hope: "Growing Hope (AI WRITTEN)"
  va_silvermoon_wretched_hope_desc: "The first Wretched have been healed. The court's patience is paying off. (AI WRITTEN)"
  va_silvermoon_wretched_families: "Families Reunited (AI WRITTEN)"
  va_silvermoon_wretched_families_desc: "Families in Silvermoon find their lost kin among the healed Wretched. (AI WRITTEN)"
  va_silvermoon_wretched_ranger_volunteers: "Healed Rangers (AI WRITTEN)"
  va_silvermoon_wretched_ranger_volunteers_desc: "Former Wretched serve among the Farstriders, eager to prove themselves. (AI WRITTEN)"
  va_silvermoon_wretched_worker_volunteers: "Healed Workers (AI WRITTEN)"
  va_silvermoon_wretched_worker_volunteers_desc: "Former Wretched labor in our workshops with the zeal of the newly sober. (AI WRITTEN)"
  va_silvermoon_wretched_absorbed_mild: "The Wretched Absorbed (AI WRITTEN)"
  va_silvermoon_wretched_absorbed_mild_desc: "The Wretched were taken in half-healed. Some still resent the court for it. (AI WRITTEN)"
  va_silvermoon_wretched_absorbed_light: "The Wretched Absorbed (AI WRITTEN)"
  va_silvermoon_wretched_absorbed_light_desc: "The Wretched were nearly whole when we took them in, yet some ask why we did not finish the cure. (AI WRITTEN)"
  va_silvermoon_wretched_neglected: "Our Own Left Behind (AI WRITTEN)"
  va_silvermoon_wretched_neglected_desc: "Twenty years have passed and the Wretched still haunt the ruins. Quel'Thalas cannot even care for its own people. (AI WRITTEN)"
  va_silvermoon_mana_store_crackdown: "Mana Stores Guarded (AI WRITTEN)"
  va_silvermoon_mana_store_crackdown_desc: "Soldiers guard the Mana stores against starving addicts, and the addicts' families seethe. (AI WRITTEN)"

  va_wretched_addiction_down_tt: "The #bold Wretched hunger#! eases by one stage (AI WRITTEN)"
  va_wretched_threat_down_20_tt: "#bold Wretched Threat#! #positive_value -20#! (AI WRITTEN)"
  va_wretched_threat_up_30_tt: "#bold Wretched Threat#! #negative_value +30#! (AI WRITTEN)"
  va_silvermoon_wretched_no_hunt_tt: "No other hunt is underway (AI WRITTEN)"
  va_silvermoon_wretched_hunt_cooldown_tt: "No hunt for this leader has failed in the last year (AI WRITTEN)"

  va_silvermoon_wretched_bounty_thaelis_button: "WANTED: Thaelis the Hungerer (AI WRITTEN)"
  va_silvermoon_wretched_bounty_thaelis_button_desc: "Post a bounty of @money!30,000 on the leader of the Wretched in the ruins. Each month our hunters have a 15% chance to bring back his head; after 12 months the hunt fails and the threat grows. (AI WRITTEN)"
  va_silvermoon_wretched_bounty_aldaron_button: "Strike at Aldaron the Reckless (AI WRITTEN)"
  va_silvermoon_wretched_bounty_aldaron_button_desc: "Send Rangers for @money!25,000 to kill the ringleader of Sunsail Anchorage while he lies in a Mana stupor. 20% chance each month, at most 12 months. His death frees our harbor. (AI WRITTEN)"
  va_silvermoon_wretched_bounty_felendren_button: "Hunt Felendren the Banished (AI WRITTEN)"
  va_silvermoon_wretched_bounty_felendren_button_desc: "Storm the Falthrien Academy for @money!20,000 and end the banished magister who stirs up the Wretched. 25% chance each month, at most 12 months. (AI WRITTEN)"

  va_name_thaelis: "Thaelis"
  va_name_the_hungerer: "the Hungerer (AI WRITTEN)"
  va_name_aldaron: "Aldaron"
  va_name_the_reckless: "the Reckless (AI WRITTEN)"
  va_name_felendren: "Felendren"
  va_name_the_banished: "the Banished (AI WRITTEN)"

  wretched_heal_events.1.t: "The First to Recover (AI WRITTEN)"
  wretched_heal_events.1.d: "After months of fever and screaming, the first Wretched have woken without the hunger gnawing at them. They ask for bread instead of crystals. Our healers weep with them. (AI WRITTEN)"
  wretched_heal_events.1.f: "\"She knew my name. For the first time in years, she knew my name.\" (AI WRITTEN)"
  wretched_heal_events.1.a: "The work goes on. (AI WRITTEN)"
  wretched_heal_events.2.t: "Their Eyes Grow Clear (AI WRITTEN)"
  wretched_heal_events.2.d: "Most of the Wretched now master their hunger. Many ask how they can repay Silvermoon. The Farstriders would take them; so would our workshops. (AI WRITTEN)"
  wretched_heal_events.2.f: "\"Give us work, and we will show you who we were.\" (AI WRITTEN)"
  wretched_heal_events.2.a: "Let them serve with the Rangers. (AI WRITTEN)"
  wretched_heal_events.2.b: "Let them work in our workshops. (AI WRITTEN)"
  wretched_heal_events.3.t: "Relapse (AI WRITTEN)"
  wretched_heal_events.3.d: "Mana has run out in the Wretched market for months. Our patients claw at the doors of the infirmaries, and some have fled back to the ruins. (AI WRITTEN)"
  wretched_heal_events.3.f: "\"Months of work, undone by an empty crate.\" (AI WRITTEN)"
  wretched_heal_events.3.a: "Send an emergency shipment of Mana. (AI WRITTEN)"
  wretched_heal_events.3.b: "We cannot afford it. (AI WRITTEN)"
  wretched_heal_events.3.b.tt: "The healing loses #negative_value 6 months#! of progress (AI WRITTEN)"
  wretched_heal_events.4.t: "Plunder of the Mana Stores (AI WRITTEN)"
  wretched_heal_events.4.d: "Addicts from the former lands of the Wretched have broken into a Mana store. The guards ask for orders, the healers for funds. (AI WRITTEN)"
  wretched_heal_events.4.f: "\"They were never healed. We only moved the hunger inside our walls.\" (AI WRITTEN)"
  wretched_heal_events.4.a: "Guard the stores with steel. (AI WRITTEN)"
  wretched_heal_events.4.b: "Pay for their care. (AI WRITTEN)"

  wretched_bounty_events.1.t: "WANTED: Thaelis the Hungerer (AI WRITTEN)"
  wretched_bounty_events.1.d: "Our hunters have returned from the ruins with the head of Thaelis the Hungerer. Sergeant Kan'ren paid the bounty without a word. The Wretched in the ruins have lost their leader. (AI WRITTEN)"
  wretched_bounty_events.1.f: "\"He was a magister once. Remember that, when you tell the story.\" (AI WRITTEN)"
  wretched_bounty_events.1.a: "Justice is done. (AI WRITTEN)"
  wretched_bounty_events.2.t: "The Hunt Has Failed (AI WRITTEN)"
  wretched_bounty_events.2.d: "A year has passed and our hunters have found nothing but traps and the bodies of their comrades. The Wretched mock our bounty from the ruins. (AI WRITTEN)"
  wretched_bounty_events.2.f: "\"They know the ruins. We only know the maps.\" (AI WRITTEN)"
  wretched_bounty_events.2.a: "We will try again. (AI WRITTEN)"
  wretched_bounty_events.2.a.tt: "We cannot hunt this leader again for a year (AI WRITTEN)"
  wretched_bounty_events.3.t: "The Ringleader Falls (AI WRITTEN)"
  wretched_bounty_events.3.d: "Our Rangers struck while Aldaron the Reckless and his band lay dazed in a Mana stupor. Aldaron is dead, the stolen Ranger weapons are recovered, and the docks of Sunsail Anchorage are ours again. (AI WRITTEN)"
  wretched_bounty_events.3.f: "\"Reckless to the end.\" (AI WRITTEN)"
  wretched_bounty_events.3.a: "Reopen the harbor. (AI WRITTEN)"
  wretched_bounty_events.4.t: "Felendren the Banished (AI WRITTEN)"
  wretched_bounty_events.4.d: "Felendren the Banished is dead, slain among the arcane wraiths of the Falthrien Academy. In his hand our soldiers found a tainted arcane sliver that still hums with a power none of our magisters recognize. (AI WRITTEN)"
  wretched_bounty_events.4.f: "\"Whoever gave him this did not mean him well. Or us.\" (AI WRITTEN)"
  wretched_bounty_events.4.a: "Arcanist Helion shall study it. (AI WRITTEN)"
  wretched_bounty_events.4.b: "Destroy the sliver. (AI WRITTEN)"
  wretched_bounty_events.5.t: "The Wretched Take Revenge (AI WRITTEN)"
  wretched_bounty_events.5.d: "Enraged by the death of one of their leaders, the Wretched have raided our roads and outposts. They left the bodies where we would find them. (AI WRITTEN)"
  wretched_bounty_events.5.f: "\"Every head we take, they answer with ten.\" (AI WRITTEN)"
  wretched_bounty_events.5.a: "Bury the dead. (AI WRITTEN)"
  wretched_bounty_events.6.t: "The Wretched Fall Apart (AI WRITTEN)"
  wretched_bounty_events.6.d: "With Thaelis, Aldaron and Felendren dead, the Wretched have no one left to follow. Their bands turned on each other and on the land itself. Silvermoon takes back what remains: burnt fields, gutted halls and addicts without a master. (AI WRITTEN)"
  wretched_bounty_events.6.f: "\"We have our land back. It is not the land we lost.\" (AI WRITTEN)"
  wretched_bounty_events.6.a: "Begin rebuilding. (AI WRITTEN)"
  wretched_bounty_events.6.a.tt: "The lands of the Wretched join Silvermoon, #negative_value devastated#! and burdened with #bold Wretched Addicts#! according to their hunger (AI WRITTEN)"

  mana_uprising_events.1.t: "Hungry in the Streets (AI WRITTEN)"
  mana_uprising_events.1.d: "For a year our people have gone without enough Mana. In the poorer quarters, the hungry gather in silence before the Mana stores. Some already whisper about the Wretched. (AI WRITTEN)"
  mana_uprising_events.1.f: "\"This is how it began in the ruins.\" (AI WRITTEN)"
  mana_uprising_events.1.a: "Open the emergency stores. (AI WRITTEN)"
  mana_uprising_events.1.a.tt: "The unrest over Mana shortage eases by #positive_value 6 months#! (AI WRITTEN)"
  mana_uprising_events.1.b: "Reinforce the guards. (AI WRITTEN)"
  mana_uprising_events.1.b.tt: "The Mana shortage remains. #negative_value If it lasts another year, the hungry will rise.#! (AI WRITTEN)"
  mana_uprising_events.2.t: "Rise of the Wretched (AI WRITTEN)"
  mana_uprising_events.2.d: "Two years without enough Mana have done what no enemy could. Starving elves have risen in one of our provinces, driven out our officials and declared themselves free of a crown that let them hunger. The Wretched have returned. (AI WRITTEN)"
  mana_uprising_events.2.f: "\"We were warned.\" (AI WRITTEN)"
  mana_uprising_events.2.a: "Bring them back by force. (AI WRITTEN)"
  mana_uprising_events.2.a.tt: "A province breaks away as the #bold Wretched#! and we go to war to take it back (AI WRITTEN)"
  mana_uprising_events.3.t: "Flight to the Ruins (AI WRITTEN)"
  mana_uprising_events.3.d: "Two years without enough Mana have driven thousands of our people to despair. They have fled to the Wretched, and those left behind curse the crown. (AI WRITTEN)"
  mana_uprising_events.3.f: "\"The ruins feed them better than we do.\" (AI WRITTEN)"
  mana_uprising_events.3.a: "Let them go. (AI WRITTEN)"
