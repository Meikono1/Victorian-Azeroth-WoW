l_english:
  je_silvermoon_deathholme: "Drive Out Deathholme (AI WRITTEN)"
  je_silvermoon_deathholme_reason: "In the Ghostlands, the Scourge necropolis of Deathholme still festers on our soil. As long as it stands, the dead walk where our people once lived. Destroy it. (AI WRITTEN)"
  je_silvermoon_zul_aman: "Raze Zul'Aman (AI WRITTEN)"
  je_silvermoon_zul_aman_reason: "The Amani trolls have hated our people since the first elves set foot in these forests. Zul'jin gathers the tribes again. Take Zul'Aman and Tor Watha, and the dream of an Amani empire dies with them. (AI WRITTEN)"
  je_silvermoon_zul_aman_shatter_tt: "The Amani lose all hope of restoring their empire (AI WRITTEN)"


  va_silvermoon_ghostlands_avenged: "The Ghostlands Avenged (AI WRITTEN)"
  va_silvermoon_ghostlands_avenged_desc: "Deathholme has fallen. Our people take pride in having driven the Scourge from their land. (AI WRITTEN)"
  va_silvermoon_deathholme_endures: "Deathholme Endures (AI WRITTEN)"
  va_silvermoon_deathholme_endures_desc: "Years have passed, and the Scourge still holds Deathholme. Other nations whisper that Quel'Thalas cannot defend itself. (AI WRITTEN)"
  va_silvermoon_amani_broken: "The Amani Broken (AI WRITTEN)"
  va_silvermoon_amani_broken_desc: "Zul'Aman lies in our hands. The ancient troll threat to Quel'Thalas is ended. (AI WRITTEN)"

  silvermoon_events.2.t: "Deathholme Falls (AI WRITTEN)"
  silvermoon_events.2.d: "The necropolis of Deathholme has been torn down and its masters destroyed. For the first time since the Third War, the Ghostlands belong to the living. (AI WRITTEN)"
  silvermoon_events.2.f: "\"Let the ashes of the Scourge feed the soil they poisoned.\" (AI WRITTEN)"
  silvermoon_events.2.a: "Quel'Thalas avenged. (AI WRITTEN)"
  silvermoon_events.3.t: "Zul'Aman Taken (AI WRITTEN)"
  silvermoon_events.3.d: "Our banners fly over the temple city of Zul'Aman. The Amani tribes are scattered, and their old dream of an empire lies in ruins. (AI WRITTEN)"
  silvermoon_events.3.f: "\"Four thousand years of war, and it ends here.\" (AI WRITTEN)"
  silvermoon_events.3.a: "Let the forests be quiet. (AI WRITTEN)"

  je_silvermoon_corridor: "The Road to Tranquillien (AI WRITTEN)"
  je_silvermoon_corridor_reason: "Tranquillien holds out in the Ghostlands, cut off from Silvermoon by the lands of Deathholme. Its people starve for supplies and its goods never reach our markets.\n\nWe can open the road #bold stage by stage#!: each #bold Logistics Operation#! costs #bold @money!100,000#! at once and drains our #bold Bureaucracy#! and #bold Authority#! until it is done. After #bold 18 months#! the Rangers secure the next stretch of land from the Scourge. Operations stall while we are at war. Three stages lead to Tranquillien – or we take the road by force. (AI WRITTEN)"
  je_silvermoon_corridor_status_idle: "No operation is underway. (AI WRITTEN)"
  je_silvermoon_corridor_status_running: "Our Rangers and quartermasters are pushing the road towards Tranquillien. (AI WRITTEN)"
  je_silvermoon_corridor_status_war: "The operation stalls while we are at war. (AI WRITTEN)"
  va_silvermoon_corridor_open_tt: "A land route links Silvermoon with Tranquillien (AI WRITTEN)"
  va_silvermoon_corridor_bar: "Logistics Operation (AI WRITTEN)"
  va_silvermoon_corridor_bar_desc: "Months of work on the current stage. At 18 the stretch is secured. (AI WRITTEN)"
  va_silvermoon_corridor_bar_progress_desc: "Operation underway (AI WRITTEN)"
  va_silvermoon_corridor_bar_stalled_desc: "#negative_value Stalled: we are at war#! (AI WRITTEN)"
  va_silvermoon_corridor_start_button: "Launch Logistics Operation (AI WRITTEN)"
  va_silvermoon_corridor_start_button_desc: "Send Rangers, healers and supply wagons to secure the next stretch of the road to Tranquillien. Costs @money!100,000 now and Bureaucracy and Authority until the stage is secured. (AI WRITTEN)"
  va_silvermoon_corridor_stage_contested_tt: "Deathholme still holds land in the next stage (AI WRITTEN)"
  va_silvermoon_corridor_not_at_war_tt: "We are not at war (AI WRITTEN)"
  va_silvermoon_corridor_not_bankrupt_tt: "We have not declared bankruptcy (AI WRITTEN)"

  va_silvermoon_corridor_logistics: "Logistics Operation (AI WRITTEN)"
  va_silvermoon_corridor_logistics_desc: "Officials, Rangers and supplies are bound up in securing the road to Tranquillien. (AI WRITTEN)"
  va_silvermoon_road_to_tranquillien: "The Road to Tranquillien (AI WRITTEN)"
  va_silvermoon_road_to_tranquillien_desc: "Caravans travel again between Silvermoon and Tranquillien. (AI WRITTEN)"

  silvermoon_events.4.t: "A Stretch of Road Secured (AI WRITTEN)"
  silvermoon_events.4.d: "After months of work our Rangers have driven the dead from another stretch of the Ghostlands. Wards are raised, wells are cleansed and the first wagons roll forward. (AI WRITTEN)"
  silvermoon_events.4.f: "\"Every mile we take back is a mile the Scourge must cross again.\" (AI WRITTEN)"
  silvermoon_events.4.a: "Onwards. (AI WRITTEN)"
  silvermoon_events.5.t: "The Road Is Open (AI WRITTEN)"
  silvermoon_events.5.d: "For the first time since the Scourge came, caravans from Silvermoon reach the gates of Tranquillien. Food, Mana and soldiers flow south, and the goods of the Ghostlands find their way to our markets. (AI WRITTEN)"
  silvermoon_events.5.f: "\"Tranquillien is no longer alone.\" (AI WRITTEN)"
  silvermoon_events.5.a: "Quel'Thalas is one again. (AI WRITTEN)"
