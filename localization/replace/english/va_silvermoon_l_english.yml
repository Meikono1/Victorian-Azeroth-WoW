l_english:
  je_silvermoon_deathholme: "Drive Out Deathholme"
  je_silvermoon_deathholme_reason: "The necropolis in the Ghostlands still festers on our soil. As long as it stands, our people will never be free from its past. We have to destroy it once it is weakened enough."
  je_silvermoon_zul_aman: "Raze Zul'Aman"
  je_silvermoon_zul_aman_reason: "Since the first of our kind set foot beneath these boughs, the Amani have hungered for our ruin. Now Zul'jin gathers the tribes once more, as though the lessons of the Troll Wars were never taught. Should Zul'Aman and Tor'Watha fall to our banners, the dream of an Amani empire will perish with them, as it ought to have long ago."
  je_silvermoon_zul_aman_shatter_tt: "The Amani lose all hope of restoring their empire"


  va_silvermoon_ghostlands_avenged: "The Ghostlands Avenged"
  va_silvermoon_ghostlands_avenged_desc: "Deathholme has fallen, and the Ghostlands are cleansed of the Scourge's stain. Our people walk taller for it, and the shame of the Third War weighs a little less upon them."
  va_silvermoon_deathholme_endures: "Deathholme Endures"
  va_silvermoon_deathholme_endures_desc: "The years pass, and still the Scourge festers in Deathholme upon our soil. Foreign courts whisper that Quel'Thalas can no longer defend its own borders."
  va_silvermoon_amani_broken: "The Amani Broken"
  va_silvermoon_amani_broken_desc: "Zul'Aman lies in our hands. The troll menace that has shadowed Quel'Thalas since its founding is at last brought to an end."

  silvermoon_events.2.t: "Deathholme Falls"
  silvermoon_events.2.d: "The necropolis of Deathholme lies in ruin, and Dar'Khan Drathir, the traitor who opened the gates of Quel'Thalas to the Scourge, is destroyed at last. From Tranquillien, Dame Auriferous sends word that her rangers and High Executor Mavren's Forsaken stood beside ours until the very end. For the first time since the Third War, the Ghostlands belong once more to the living."
  silvermoon_events.2.f: "\"Let the ashes of the Scourge nourish the very soil they once poisoned.\""
  silvermoon_events.2.a: "Quel'Thalas is avenged."
  silvermoon_events.3.t: "Zul'Aman Taken"
  silvermoon_events.3.d: "Our banners fly above the temple city of Zul'Aman. The Amani tribes are scattered to the winds, and their ancient dream of empire lies in ruins at our feet."
  silvermoon_events.3.f: "\"Four thousand years of war, and it ends here, beneath our banners.\""
  silvermoon_events.3.a: "Let the forests know peace."

  je_silvermoon_corridor: "The Road to Tranquillien"
  je_silvermoon_corridor_reason: "Tranquillien endures in the Ghostlands, severed from Silvermoon by the blighted lands of Deathholme. Its people go wanting, and its wares never reach our markets.\n\nWe can open the road #bold stage by stage#!: each #bold Logistics Operation#! costs #bold @money!100,000#! at once and drains our #bold Bureaucracy#! and #bold Authority#! until it is done. After #bold 18 months#! the Rangers secure the next stretch of land from the Scourge. Operations stall while we are at war. Three stages lead to Tranquillien – or we take the road by force."
  je_silvermoon_corridor_status_idle: "No operation is underway."
  je_silvermoon_corridor_status_running: "Our Rangers and quartermasters press the road ever onward toward Tranquillien."
  je_silvermoon_corridor_status_war: "The operation stalls while we are at war."
  va_silvermoon_corridor_open_tt: "A land route links Silvermoon with Tranquillien"
  va_silvermoon_corridor_bar: "Logistics Operation"
  va_silvermoon_corridor_bar_desc: "Months of work on the current stage. At 18 the stretch is secured."
  va_silvermoon_corridor_bar_progress_desc: "Operation underway"
  va_silvermoon_corridor_bar_stalled_desc: "#negative_value Stalled: we are at war#!"
  va_silvermoon_corridor_start_button: "Launch Logistics Operation"
  va_silvermoon_corridor_start_button_desc: "Send Rangers, healers and supply wagons to secure the next stretch of the road to Tranquillien. Costs @money!100,000 now and Bureaucracy and Authority until the stage is secured. While Halduron Brightwing leads the Farstriders, each stage takes 15 months instead of 18."
  va_silvermoon_corridor_stage_contested_tt: "Deathholme still holds land in the next stage"
  va_silvermoon_corridor_not_at_war_tt: "We are not at war"
  va_silvermoon_corridor_not_bankrupt_tt: "We have not declared bankruptcy"

  va_silvermoon_corridor_logistics: "Logistics Operation"
  va_silvermoon_corridor_logistics_desc: "Officials, Rangers and stores are bound to the task of securing the road to Tranquillien."
  va_silvermoon_road_to_tranquillien: "The Road to Tranquillien"
  va_silvermoon_road_to_tranquillien_desc: "Caravans pass once more between Silvermoon and Tranquillien, and the Ghostlands are no longer forgotten."

  silvermoon_events.4.t: "A Stretch of Road Secured"
  silvermoon_events.4.d: "After months of toil, our Rangers have driven the dead from yet another stretch of the Ghostlands. Wards are raised, wells are cleansed, and the first wagons roll onward."
  silvermoon_events.4.f: "\"Every league we reclaim is a league the Scourge must cross anew.\""
  silvermoon_events.4.a: "Onward."
  silvermoon_events.5.t: "The Road Is Open"
  silvermoon_events.5.d: "For the first time since the Scourge came, caravans from Silvermoon reach the gates of Tranquillien. Food, Mana and soldiers flow southward, and the bounty of the Ghostlands finds its way to our markets once more."
  silvermoon_events.5.f: "\"Tranquillien stands alone no longer.\""
  silvermoon_events.5.a: "Quel'Thalas is united once more."
  # Figuren in Silvermoon-JEs (VA-066)
  va_has_halduron_tt: "Halduron Brightwing serves our realm"
  va_has_rommath_tt: "Grand Magister Rommath serves our realm"
  va_has_liadrin_tt: "Liadrin serves our realm"
  va_silvermoon_corridor_bar_halduron_desc: "Halduron Brightwing leads the Farstriders"
  va_silvermoon_blood_knight_wardens: "Blood Knight Wardens"
  va_silvermoon_blood_knight_wardens_desc: "Liadrin's Blood Knights stand watch over the ritual sites upon the Dead Scar, sparing our magisters much of their burden."
