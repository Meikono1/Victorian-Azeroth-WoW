l_english:
  # Amani-Reihe von Zul'Jarra (VA-022). Ohne Marker: von Kono abgenommen (2026-11-13). Stil (Kono): Schalter, Tooltips, Balken gut lesbar; Beschreibungen, Events, Zitate im Troll-Slang ("da", "mon", "dem", "be").

  # --- je_amani_tribes
  je_amani_tribes: "Gather the Tribes"
  je_amani_tribes_reason: "Da Amani tribes were one big people, before da war we stood as one. Now da Shadowpine answer do Amani only in name, and da Mossflayer sit alone in Mashar. Call back da lost brothers and unite Amani, by word or by axe."
  je_amani_tribes_shadowpine_tt: "Da Shadowpine have been united into da Amani"
  je_amani_tribes_mossflayer_tt: "Da Mossflayer are our subject, or Zul'Mashar is ours"
  je_amani_tribes_status_war: "War means no Politics"
  je_amani_tribes_status_summons: "Shadowpine chieftains are travelling to Zul'Aman to swear their oaths."
  je_amani_tribes_status_idle: "Da tribes wait and look at what Zul'jin will do."
  va_amani_shadowpine_button: "Summon the Shadowpine"
  va_amani_shadowpine_button_desc: "Call the Shadowpine chieftains to Zul'Aman and fold their villages into our realm. Costs a tribute of #bold @money!50,000#! at once, takes 36 months of peace and costs Authority while it lasts."
  va_amani_shadowpine_subject_tt: "Da Shadowpine serve da Amani"
  va_amani_not_at_war_tt: "We are not at war"
  va_amani_mossflayer_button: "Send Envoys to Zul'Mashar"
  va_amani_mossflayer_button_desc: "Offer the Mossflayer a place under Zul'jin. They may accept and become our subject, or refuse, which gives us a claim on Zul'Mashar. We can repeat the request after a year."
  va_amani_mossflayer_free_tt: "Da Mossflayer will not be servants others"
  va_amani_mossflayer_peace_tt: "We are not at war with da Mossflayer"
  va_amani_mossflayer_cooldown_tt: "A year has passed since our last envoys"
  va_amani_shadowpine_bar: "Shadowpine Oaths"
  va_amani_shadowpine_bar_desc: "How many Shadowpine chieftains have sworn to Zul'jin. At 36 the Shadowpine join our realm."
  va_amani_shadowpine_bar_progress_desc: "Chieftains swearing their oaths"
  va_amani_shadowpine_bar_stalled_desc: "At war: no chieftain leaves his village"

  # --- je_amani_loa
  je_amani_loa: "Malacrass and the Loa"
  je_amani_loa_reason: "Hex Lord Malacrass claims he do what no other priest has dared: draw da essence of loa and bind into Amani champions. Da priests call it treason. Zul'jin calls it da weapon we needs. Each Loa can be bound for great power or honored for lesser blessing."
  je_amani_loa_all_decided_tt: "All four Loa have been bound or honored"
  je_amani_loa_status_war: "Da ritual rests while we are at war."
  je_amani_loa_status_ritual: "Malacrass is preparing a ritual."
  je_amani_loa_status_idle: "Da shrines are quiet."
  va_amani_loa_akilzon_button: "Ritual of Akil'zon, the Eagle"
  va_amani_loa_akilzon_button_desc: "Costs 25,000 and Authority for 24 months of peace. At the end we choose to bind the Eagle (strong bonus to army offense) or honor him (half the bonus)."
  va_amani_loa_nalorakk_button: "Ritual of Nalorakk, the Bear"
  va_amani_loa_nalorakk_button_desc: "Costs 25,000 and Authority for 24 months of peace. At the end we choose to bind the Bear (strong bonus to army defense) or honor him (half the bonus)."
  va_amani_loa_janalai_button: "Ritual of Jan'alai, the Dragonhawk"
  va_amani_loa_janalai_button_desc: "Costs 25,000 and Authority for 24 months of peace. At the end we choose to bind the Dragonhawk (troops lose much less morale) or honor him (half the bonus)."
  va_amani_loa_halazzi_button: "Ritual of Halazzi, the Lynx"
  va_amani_loa_halazzi_button_desc: "Costs 25,000 and Authority for 24 months of peace. At the end we choose to bind the Lynx (much faster training) or honor him (half the bonus)."
  va_amani_loa_one_ritual_tt: "No other ritual is under way"
  va_amani_not_bankrupt_tt: "We are not bankrupt"
  va_amani_loa_wrath_up_tt: "Da wrath of the Loa grows... But da Power of Loa belongs to Amani!"
  va_amani_loa_bar: "Ritual Preparations"
  va_amani_loa_bar_desc: "Progress of the current ritual. At 24 Malacrass is ready and we must decide the fate of the Loa."
  va_amani_loa_bar_progress_desc: "Malacrass prepares the ritual"
  va_amani_loa_bar_stalled_desc: "At war: the ritual rests"

  # --- je_amani_siege
  je_amani_siege: "The Siege of Zul'Aman"
  je_amani_siege_reason: "Da elves of Silvermoon pushed our people back to da walls of our once mighty Zul'Aman. Everybody always wanna take from us. Line of elven, blue and white run through our lands. Take da whole Sanctum and pull the blood from the bloodelves. If Zul'Aman and Tor'Watha fall, the Amani are finished."
  je_amani_siege_heartland_lost_tt: "We hold no land in Zul'Aman or Tor'Watha"

  # --- je_amani_empire
  je_amani_empire: "Restore the Amani Empire"
  va_amani_empire_formable_tt: "We have restored da Amani Empire (Journal Entry)"
  va_amani_empire_not_shattered_tt: "Silvermoon has not broken the Amani by taking Zul'Aman"
  je_amani_empire_reason: "Before da pointy-ears came, da Amani ruled every forest from da northern sea to da mountains. Zul'jin swore vengeance and raise da empire again. He need da tribes behind him, da siege broken and da Loa at his side."
  je_amani_empire_tribes_tt: "The tribes are gathered (Journal Entry: Gather the Tribes)"
  je_amani_empire_siege_tt: "The siege is broken or endured (Journal Entry: The Siege of Zul'Aman)"
  je_amani_empire_loa_tt: "At least two Loa have been bound or honored"

  # --- je_amani_vengeance
  je_amani_vengeance: "Vengeance for Zul'Aman"
  je_amani_vengeance_reason: "Da empire be standin' again, but da elves still walk in da woods dey stole from us. Zul'jin gave an eye and arm to dis war. Now he want da forest back! startin' with Tranquillien and Suncrown Village."

  # --- Modifier (Namen lesbar, Beschreibungen im Troll-Ton)
  va_amani_shadowpine_summons: "Summons to the Shadowpine"
  va_amani_shadowpine_summons_desc: "Feasts, gifts and a few threats for da Shadowpine chieftains. Dey come, or dey regret it."
  va_amani_tribes_united: "Tribes United"
  va_amani_tribes_united_desc: "Shadowpine and Mossflayer follow Zul'jin now. One people, one warlord, mon."
  va_amani_tribes_divided: "Tribes Divided"
  va_amani_tribes_divided_desc: "Zul'jin promised one people. Da tribes still be waitin'."
  va_amani_loa_ritual: "Ritual of Malacrass"
  va_amani_loa_ritual_desc: "Da Hex Lord takes priests, offerings and guards as he pleases. Nobody be sayin' no to him."
  va_amani_loa_akilzon_bound: "Essence of the Eagle"
  va_amani_loa_akilzon_bound_desc: "Akil'zon's storm ride with our warriors, if he like it or not."
  va_amani_loa_akilzon_honored: "Blessing of the Eagle"
  va_amani_loa_akilzon_honored_desc: "Akil'zon be watchin' over our war bands from da sky."
  va_amani_loa_nalorakk_bound: "Essence of the Bear"
  va_amani_loa_nalorakk_bound_desc: "Nalorakk's strength hold our lines, if he like it or not."
  va_amani_loa_nalorakk_honored: "Blessing of the Bear"
  va_amani_loa_nalorakk_honored_desc: "Nalorakk stand with dem who defend dey home."
  va_amani_loa_janalai_bound: "Essence of the Dragonhawk"
  va_amani_loa_janalai_bound_desc: "Jan'alai's fire burn in our warriors and our enemies."
  va_amani_loa_janalai_honored: "Blessing of the Dragonhawk"
  va_amani_loa_janalai_honored_desc: "Jan'alai give courage to dem who ask for it."
  va_amani_loa_halazzi_bound: "Essence of the Lynx"
  va_amani_loa_halazzi_bound_desc: "Halazzi's hunters teach our young ones to kill."
  va_amani_loa_halazzi_honored: "Blessing of the Lynx"
  va_amani_loa_halazzi_honored_desc: "Halazzi smile on da young hunters."
  va_amani_priests_defied: "Loa Defiled"
  va_amani_priests_defied_desc: "Da priests don't forget what be done at da shrines. But they serve."
  va_amani_priests_honored: "Loa Honored"
  va_amani_priests_honored_desc: "Da priests be pleased. Da old ways still be kept."
  va_amani_power_of_the_loa: "Power of the Loa"
  va_amani_power_of_the_loa_desc: "All four animal gods have answered Zul'Aman, one way or da other."
  va_amani_hexlord_sacrificed: "Hex Lord Sacrificed"
  va_amani_hexlord_sacrificed_desc: "Malacrass paid for da anger of da Loa. Zul'jin's court be weaker without him."
  va_amani_loa_forsaken: "Forsaken by the Loa"
  va_amani_loa_forsaken_desc: "Da faithful say da gods turned dey backs on Zul'Aman."
  va_amani_besieged: "Besieged"
  va_amani_besieged_desc: "Elven rangers be watchin' every path out of Zul'Aman."
  va_amani_siege_broken: "Siege Broken"
  va_amani_siege_broken_desc: "Da elves couldn't keep da Amani behind dey walls. Nobody can!"
  va_amani_empire_restored: "Amani Empire Restored"
  va_amani_empire_restored_desc: "For da first time in thousands of years, da forest trolls answer to one throne."
  va_amani_forest_reclaimed: "The Forest Reclaimed"
  va_amani_forest_reclaimed_desc: "Da woods south of Silvermoon belong to da Amani again."
  va_amani_trespassers_executed: "Trespassers Executed"
  va_amani_trespassers_executed_desc: "Dey heads on da wall, everybody understands."
  va_amani_relic_lost: "Relic Lost"
  va_amani_relic_lost_desc: "Thieves carried a loa artifact out of Zul'Aman! Find them!"

  # --- amani_events
  amani_events.1.t: "The Shadowpine Come Home"
  amani_events.1.d: "Da last Shadowpine chieftain laid his axe at da foot of Zul'jin's throne. Villages in da elven woods no longer be a vassal's land. Dey be Amani."
  amani_events.1.f: "\"We be one tribe now. Anyone who forget dat can explain himself to da warlord.\""
  amani_events.1.a: "One people."
  amani_events.2.t: "Envoys from Zul'Aman"
  amani_events.2.d: "Warriors in Zul'jin's colors crossed da plagued lands to reach Zul'Mashar. \"Da Amani rise under Zul'jin and da Mossflayer gonna take dey place under da Amani.\""
  amani_events.2.f: "\"Zul'jin remember who stood with him against da elves. He also remember who didn't.\""
  amani_events.2.a: "We follow Zul'jin."
  amani_events.2.b: "Da Mossflayer bow to nobody."
  amani_events.3.t: "The Mossflayer Submit"
  amani_events.3.d: "Our envoys come back from Zul'Mashar with gifts and hostages. Da Mossflayer take Zul'jin as da new warlord."
  amani_events.3.f: "\"Dey lived among da dead down dere. Maybe dat taught dem when to pick da winnin' side.\""
  amani_events.3.a: "Welcome dem."
  amani_events.4.t: "The Mossflayer Refuse"
  amani_events.4.d: "Our envoys come back from Zul'Mashar with empty hands. Da Mossflayer won't follow Zul'jin. Da warlord says dey land be forfeit now."
  amani_events.4.f: "\"Dey lived among da dead for to long. Mebbe Mossflayer are lost.\""
  amani_events.4.a: "Zul'Mashar be ours anyway."
  amani_events.5.t: "One Banner"
  amani_events.5.d: "Shadowpine and Mossflayer stand with Amani. For da first time since da Troll Wars, da forest tribes of da north speak with one voice, and dat voice be Amani."
  amani_events.5.f: "\"Da elves counted on us hatin' each other more dan we hate dem. Dey counted wrong, mon.\""
  amani_events.5.a: "Da Amani are one."
  amani_events.10.t: "The Siege Is Broken"
  amani_events.10.d: "Da Sanctum has fallen. Da elven rangers and sentinels be out of Zul'Aman. Silvermoon wanted to lock da Amani in dey own city. Dey failed."
  amani_events.10.f: "\"Dey built a cage. We found a fortress.\""
  amani_events.10.a: "Da forest be open."
  amani_events.11.t: "The Amani Empire Rises"
  amani_events.11.d: "Da tribes be gathered, da elves couldn't hold anything and da Loa have answered. In da great court of Zul'Aman, Zul'jin proclaimed what no troll dared to say for thousands of years: da Amani Empire lives!\n\nOnce we hold enough of the old Amani lands, we can #bold revive the Amani Empire#!."
  amani_events.11.f: "\"Nobody be badder than me.\""
  amani_events.11.a: "Now for da elves."
  amani_events.11.a.tt: "We receive the Journal Entry Vengeance for Zul'Aman."
  amani_events.12.t: "The Forest Is Ours Again"
  amani_events.12.d: "Tranquillien and Suncrown Village be in Amani hands. Where elven spires stood, troll drums sound through da night. Zul'jin took back da first of da lands his ancestors lost."
  amani_events.12.f: "\"An eye and an arm. I told dem I gonna be back.\""
  amani_events.12.a: "Da debt be paid."

  # --- amani_loa_events
  amani_loa_events.1.t: "The Shrine of the Eagle"
  amani_loa_events.1.d: "Malacrass finished his work at da shrine of Akil'zon. Da Eagle Loa can now be torn from his altar and bound into a champion of storm and lightning. His priests beg us to honor him instead and take da blessing he be givin freely."
  amani_loa_events.1.f: "\"He be da storm. Put da storm in a warrior's fists, warlord. Just say da word.\""
  amani_loa_events.1.a: "Bind da Eagle."
  amani_loa_events.1.b: "Honor Akil'zon."
  amani_loa_events.2.t: "The Shrine of the Bear"
  amani_loa_events.2.d: "Malacrass finished his work at da shrine of Nalorakk. Da Bear Loa can now be bound into a champion of strength and power. His priests beg us to honor him instead and take da blessing he be givin freely."
  amani_loa_events.2.f: "\"Da Bear don't want Amani strong, but we will be strong.\""
  amani_loa_events.2.a: "Bind da Bear."
  amani_loa_events.2.b: "Honor Nalorakk."
  amani_loa_events.3.t: "The Shrine of the Dragonhawk"
  amani_loa_events.3.d: "Malacrass finished his work at da shrine of Jan'alai. Da Dragonhawk Loa can now be bound into a champion to burn our enemies. His priests beg us to honor him instead and take da blessing he be givin freely."
  amani_loa_events.3.f: "\"Fire don't ask da wood for permission.\""
  amani_loa_events.3.a: "Bind da Dragonhawk."
  amani_loa_events.3.b: "Honor Jan'alai."
  amani_loa_events.4.t: "The Shrine of the Lynx"
  amani_loa_events.4.d: "Malacrass finished his work at da shrine of Halazzi. Da Lynx Loa can now be bound into a champion and hide our might for a deadly strike. His priests beg us to honor him instead and take da blessing he be givin freely."
  amani_loa_events.4.f: "\"Da Lynx be quick. My knife be quicker.\""
  amani_loa_events.4.a: "Bind da Lynx."
  amani_loa_events.4.b: "Honor Halazzi."
  amani_loa_events.5.t: "The Four Have Answered"
  amani_loa_events.5.d: "Eagle, Bear, Dragonhawk and Lynx: every shrine in Zul'Aman has seen its ritual. If da Loa came as allies or as prisoners, dey power now serve da Amani."
  amani_loa_events.5.f: "\"Da elves got dey magic. We got our gods.\""
  amani_loa_events.5.a: "Zul'Aman be ready."
  amani_loa_events.6.t: "The Loa Turn Away"
  amani_loa_events.6.d: "Three of da animal gods lie bound, and da people noticed. Offerings rot on da altars, hunters come back with nothin', and da priests say it loud: Malacrass made Zul'Aman a city of traitors. Dey want da Hex Lord's life as da price of peace with da gods."
  amani_loa_events.6.f: "\"You wanted power, warlord. I gave you power. Don't act surprised it got a price.\""
  amani_loa_events.6.a: "Give dem Malacrass."
  amani_loa_events.6.b: "Da Hex Lord stays. Let dem mutter."

  # --- amani_treasure_events
  amani_treasure_events.1.t: "Grave Robbers in the Outer Court"
  amani_treasure_events.1.d: "Da guards caught a band of outsiders diggin' in da tombs of da outer court, dey packs full of gold masks and burial knives. Dey say a man named Budd promised dem an easy fortune."
  amani_treasure_events.1.f: "\"Easy, he said. In and out, he said.\""
  amani_treasure_events.1.a: "Dey heads go on da wall."
  amani_treasure_events.1.b: "Somebody gonna pay to have dem back."
  amani_treasure_events.2.t: "An Expedition at the Gate"
  amani_treasure_events.2.d: "A foreign expedition made camp outside da walls. Dey leader offer good coin to trade and to draw da old carvings. Da priests want dem gone before dey see anything holy."
  amani_treasure_events.2.f: "\"We only wish to study your magnificent culture. And perhaps purchase a few small souvenirs.\""
  amani_treasure_events.2.a: "Zul'Aman be closed. Drive dem off."
  amani_treasure_events.2.b: "Dey gold be welcome. Dey stay outside da temples."
  amani_treasure_events.3.t: "A Relic Is Missing"
  amani_treasure_events.3.d: "A carved idol vanished from one of da lesser shrines. Tracks lead through da forest to da coast, where a ship was waitin'. If we do nothin', every thief in da north gonna hear dat Zul'Aman can be robbed."
  amani_treasure_events.3.f: "\"Dey took it in da night, warlord. Dey knew exactly where to look.\""
  amani_treasure_events.3.a: "Send hunters after dem, whatever it cost."
  amani_treasure_events.3.b: "It be one idol. Let it go."
