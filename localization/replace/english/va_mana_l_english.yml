l_english:
  mana: "Mana"
  bg_leyline_tapping: "Ley Line Taps"
  building_leyline_tap: "Ley Line Tap"
  building_leyline_tap_desc: "Arcane energy is drawn from the ley lines running beneath the land and condensed into usable mana."
  pmg_base_building_leyline_tap: "Ley Line Focus"
  pm_focus_crystals_building_leyline_tap: "Focus Crystals"
  pm_arcane_conduits_building_leyline_tap: "Arcane Conduits"
  pm_runic_resonators_building_leyline_tap: "Runic Resonators"
  pmg_attunement_building_leyline_tap: "Attunement"
  pm_no_attunement_building_leyline_tap: "No Attunement"
  pm_arcane_sigils_building_leyline_tap: "Arcane Sigils"
  building_va_disenchantment: "Disenchantment Workshop"
  building_va_disenchantment_desc: "Heirlooms, enchanted relics and the treasures of old houses are broken down here to release the Mana bound inside them. It closes once the year of Disenchantment ends."
  bg_va_disenchantment: "Disenchantment"
  pmg_base_building_va_disenchantment: "Disenchantment"
  pm_heirloom_breaking_building_va_disenchantment: "Breaking Heirlooms"
  goods_output_mana_add: "Mana output"
  goods_output_mana_add_desc: "The amount of Mana produced by buildings"
  goods_input_mana_add: "Mana input"
  state_buy_orders_mana_add: "[GetGoods('mana').GetTextIcon][Nbsp][GetGoods('mana').GetNameNoFormatting] Buy Orders"
  state_buy_orders_mana_add_desc: "An increase or decrease to [concept_buy_orders] for [GetGoods('mana').GetName] in a [concept_state]"
  goods_input_mana_add_desc: "The amount of Mana consumed by buildings"
  building_leyline_tap_throughput_add: "$building_leyline_tap$ building [concept_throughput]"

  va_mana_abundance: "Arcane Abundance"
  va_mana_abundance_desc: "Mana flows freely through our markets. Our people thrive, and our magisters push the boundaries of arcane knowledge."
  va_mana_scarcity: "Mana Scarcity"
  va_mana_scarcity_desc: "Mana grows dear. Our people feel the hunger gnawing at them and grow restless."
  va_mana_withdrawal: "Mana Withdrawal"
  va_mana_withdrawal_desc: "Without mana, our people wither. Hands tremble, minds cloud, and some begin to turn into something wretched."

  je_mana_hunger: "The Mana Hunger"
  je_mana_hunger_reason: "Since the Sunwell fell, our people crave arcane energy. Every month the price of mana in our market decides how we fare:\n\n#bold Arcane Abundance#! (price at most 40): more research, better living.\n#bold Mana Scarcity#! (price 50 or more): lower standard of living, unrest grows faster.\n#bold Mana Withdrawal#! (price 68 or more): our people wither. Keep the ley lines tapped and the mana flowing. Every Blood Elf and High Elf adds to a constant Mana Upkeep. Until enough Ley Line Taps stand, we must ease it by other means: Disenchantment, Rationing or draining the fauna of Eversong."
  je_mana_hunger_status_abundance: "Current state: #positive_value Arcane Abundance#!"
  je_mana_hunger_status_stable: "Current state: #v Stable#!, no bonus or penalty"
  je_mana_hunger_status_scarcity: "Current state: #negative_value Mana Scarcity#!"
  je_mana_hunger_status_withdrawal: "Current state: #negative_value Mana Withdrawal#!"
  va_country_mana_dependent_trigger_tt: "A primary culture depends on mana (Sin'dorei or Quel'dorei)"
  # Grundbedarf je State (Kono-Test 2026-11-12)
  va_mana_upkeep: "Mana Upkeep"
  va_mana_upkeep_desc: "Wards, lamps, conjured food and the daily comforts of elven life all draw on Mana. Every Blood Elf and High Elf in this state adds to a steady demand that never goes away."
  # Mana-Maßnahmen (Kono 2026-11-12)
  va_mana_disenchant_button: "Disenchantment"
  va_mana_disenchant_button_desc: "Break down heirlooms, enchanted relics and the treasures of old houses to release the Mana bound inside them. A workshop in our capital produces #positive_value 10 Mana#! for 1 year, but the loss of so much heritage costs us #negative_value 10 Prestige#! for 2 years. Cannot be repeated for 2 years."
  va_mana_disenchant_cooldown_tt: "Our people need time before more of their heritage is destroyed (2 years after the last Disenchantment)"
  va_mana_rationing_start_button: "Ration Mana"
  va_mana_rationing_start_button_desc: "Mana is handed out by quota. Mana Upkeep falls by #positive_value 25%#! for as long as rationing lasts, but the #negative_value Standard of Living#! drops by 1 and Blood Elves and High Elves turn radical when it starts and every 6 months after."
  va_mana_rationing_cooldown_tt: "Rationing ended less than a year ago"
  va_mana_rationing_stop_button: "End Mana Rationing"
  va_mana_rationing_stop_button_desc: "Lift the quotas. Mana Upkeep returns to full strength. Rationing cannot be restarted for 1 year."
  va_mana_drain_fauna_button_desc: "Drain the Mana from the wyrms, lynxes and springhawks of this region. Mana Upkeep falls by #positive_value 15%#! for 1 year. The emptied land yields less for 5 years: #negative_value −30% Agriculture#! for 18 months, then −20% until year 3 and −10% until year 5. The region can be drained again after 18 months, and the penalties stack."
  va_mana_drain_fauna_recovering_tt: "This region was drained less than 18 months ago"
  va_mana_disenchant_shame: "Heritage Disenchanted"
  va_mana_disenchant_shame_desc: "The treasures of Quel'Thalas were melted into Mana. Foreign courts and our own nobles remember."
  va_mana_rationing: "Mana Rationing"
  va_mana_rationing_desc: "Every household receives a fixed quota of Mana and not a drop more."
  va_mana_drain_sunstrider_isle_button: "Drain the Fauna of Sunstrider Isle"
  va_mana_drain_ruins_of_silvermoon_button: "Drain the Fauna of the Ruins of Silvermoon"
  va_mana_drain_farstrider_retreat_button: "Drain the Fauna of Farstrider Retreat"
  va_mana_drain_duskwither_spire_button: "Drain the Fauna of Duskwither Spire"
  va_mana_drain_west_sanctum_button: "Drain the Fauna of West Sanctum"
  va_mana_drain_east_sanctum_button: "Drain the Fauna of East Sanctum"
  va_mana_drain_sunsail_anchorage_button: "Drain the Fauna of Sunsail Anchorage"
  va_mana_fauna_drained_1: "Fauna Drained"
  va_mana_fauna_drained_1_desc: "The creatures of this land were drained of their Mana. Fields and pastures wither without them."
  va_mana_fauna_depleted_1: "Fauna Depleted"
  va_mana_fauna_depleted_1_desc: "Few of the drained creatures have returned."
  va_mana_fauna_recovering_1: "Fauna Recovering"
  va_mana_fauna_recovering_1_desc: "Slowly, wildlife returns to the drained land."
